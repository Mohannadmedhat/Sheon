<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHEON | سيميليتور تجربة الموبايل</title>
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: 'Cairo', sans-serif;
        background: radial-gradient(circle at 50% 20%, #1e1e24 0%, #0d0d11 100%);
      }
      .phone-frame {
        box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 0 12px #26262b, 0 0 0 14px #1a1a1e, 0 0 0 16px #404048;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
    </style>
  </head>
  <body class="min-h-screen text-white flex flex-col items-center justify-between p-4 selection:bg-rose-500 selection:text-white">
    
    <!-- Top Control Toolbar -->
    <header class="w-full max-w-4xl bg-neutral-900/80 backdrop-blur-md border border-neutral-800 rounded-2xl p-3 sm:p-4 flex flex-wrap items-center justify-between gap-3 shadow-2xl mb-4">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-black border border-neutral-700 flex items-center justify-center font-bold text-amber-400">
          S
        </div>
        <div>
          <h1 class="text-sm sm:text-base font-bold text-white flex items-center gap-2">
            سيميليتور شاشات الموبايل · SHEON
          </h1>
          <p class="text-[11px] text-neutral-400">معاينة تفاعلية حية لنسخة التليفون مباشرة من اللابتوب</p>
        </div>
      </div>

      <!-- Device Switchers -->
      <div class="flex items-center gap-1.5 bg-neutral-950 p-1.5 rounded-xl border border-neutral-800 text-xs">
        <button onclick="setDevice(390, 844, 'iPhone 15 Pro')" id="btn-iphone" class="px-3 py-1.5 rounded-lg font-bold bg-neutral-800 text-amber-400 transition">
          iPhone 15 Pro
        </button>
        <button onclick="setDevice(412, 915, 'Galaxy S24')" id="btn-galaxy" class="px-3 py-1.5 rounded-lg font-bold text-neutral-400 hover:text-white transition">
          Galaxy S24
        </button>
        <button onclick="setDevice(375, 667, 'iPhone SE')" id="btn-se" class="px-3 py-1.5 rounded-lg font-bold text-neutral-400 hover:text-white transition">
          شاشة صغيرة (SE)
        </button>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-2">
        <button onclick="reloadFrame()" title="إعادة تحميل" class="p-2 rounded-xl bg-neutral-800 hover:bg-neutral-700 text-neutral-300 hover:text-white transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        </button>
        <a href="/" target="_blank" class="px-3 py-2 rounded-xl bg-amber-400 hover:bg-amber-300 text-neutral-900 font-bold text-xs flex items-center gap-1.5 transition">
          <span>فتح في تاب جديد</span>
          <svg class="w-3.5 h-3.5 -scale-x-100" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
        </a>
      </div>
    </header>

    <!-- Smartphone Mockup Wrapper -->
    <main class="flex-1 flex items-center justify-center w-full py-2">
      <div id="phone-container" class="phone-frame bg-black rounded-[52px] relative overflow-hidden flex flex-col items-center" style="width: 390px; height: 820px;">
        
        <!-- Dynamic Island -->
        <div class="absolute top-3.5 z-50 w-28 h-7 bg-black rounded-full flex items-center justify-between px-2.5 shadow-md pointer-events-none">
          <div class="w-2.5 h-2.5 rounded-full bg-neutral-900/90 border border-neutral-800"></div>
          <div class="w-2.5 h-2.5 rounded-full bg-[#0a1828] border border-blue-900/40"></div>
        </div>

        <!-- Speaker grill -->
        <div class="absolute top-2 z-50 w-12 h-1 bg-neutral-800 rounded-full pointer-events-none"></div>

        <!-- The Live Interactive Website Frame -->
        <iframe 
          id="preview-frame" 
          src="/" 
          class="w-full h-full border-none rounded-[44px] bg-white pt-2"
          title="SHEON Mobile Preview"
        ></iframe>

        <!-- Home Bar Indicator -->
        <div class="absolute bottom-2 z-50 w-36 h-1 bg-neutral-800/80 rounded-full pointer-events-none"></div>

      </div>
    </main>

    <!-- Bottom Status Bar -->
    <footer class="text-center text-xs text-neutral-500 py-2">
      الجهاز الحالي: <span id="current-device-name" class="font-bold text-neutral-300">iPhone 15 Pro</span> (<span id="current-dimensions">390 × 820 px</span>) · يمكنك التمرير والضغط وتجربة الموقع بالكامل كأنه تليفون حقيقي.
    </footer>

    <script>
      function setDevice(w, h, name) {
        const container = document.getElementById('phone-container');
        container.style.width = w + 'px';
        container.style.height = (h > 820 ? 820 : h) + 'px';
        document.getElementById('current-device-name').textContent = name;
        document.getElementById('current-dimensions').textContent = w + ' × ' + h + ' px';

        // Update button styles
        ['iphone', 'galaxy', 'se'].forEach(id => {
          const btn = document.getElementById('btn-' + id);
          if (btn) {
            btn.className = 'px-3 py-1.5 rounded-lg font-bold text-neutral-400 hover:text-white transition';
          }
        });

        if (name.includes('iPhone 15')) document.getElementById('btn-iphone').className = 'px-3 py-1.5 rounded-lg font-bold bg-neutral-800 text-amber-400 transition';
        if (name.includes('Galaxy')) document.getElementById('btn-galaxy').className = 'px-3 py-1.5 rounded-lg font-bold bg-neutral-800 text-amber-400 transition';
        if (name.includes('SE')) document.getElementById('btn-se').className = 'px-3 py-1.5 rounded-lg font-bold bg-neutral-800 text-amber-400 transition';
      }

      function reloadFrame() {
        const frame = document.getElementById('preview-frame');
        frame.src = frame.src;
      }
    </script>
  </body>
</html>
